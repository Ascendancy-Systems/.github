name: Render Meta-Gauge MG-001

on:
  push:
    branches-ignore:
      - main
    paths:
      - profile/signals/meta-gauge-mg-001.json
  workflow_dispatch:

concurrency:
  group: meta-gauge-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.ref_name != github.event.repository.default_branch
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out the selected branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install pinned rendering dependency
        run: python -m pip install --requirement scripts/requirements.txt

      - name: Run renderer tests
        run: python -m unittest discover -s scripts/tests -v

      - name: Render current SVG and mobile PNG
        run: python scripts/render_meta_gauge.py

      - name: Commit generated assets when changed
        shell: bash
        run: |
          if git diff --quiet -- assets/gauges/meta-gauge-current.svg assets/gauges/meta-gauge-current.png; then
            echo "Generated assets already match the authorized record."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/gauges/meta-gauge-current.svg assets/gauges/meta-gauge-current.png
          git commit -m "Render MG-001 from authorized signal"
          git push
